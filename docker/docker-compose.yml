version: '3.8'
services:
  db:
    build: .
    image: local-postgres-jsonb:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: fsync
      POSTGRES_PASSWORD: fsyncpass
      POSTGRES_DB: fsyncdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only: Postgres is reached via the events/catalog HTTP APIs,
      # never directly from the LAN. (0.0.0.0 publish would bypass firewalld.)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsync -d fsyncdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
