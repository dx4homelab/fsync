[project]
name = "fsync"
version = "0.5.0"
description = "Simple file indexing and comparison utilities"
authors = [ { name = "dev", email = "dev@example.com" } ]
readme = "readme.md"
dependencies = ["pyyaml", "textual", "fastapi", "uvicorn", "httpx", "pydantic"]

[project.scripts]
fsync = "fsync.cli:main"
[project.optional-dependencies]
progress = ["tqdm"]

[tool.setuptools]
packages = ["fsync"]
